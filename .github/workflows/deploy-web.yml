name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["rov-app/web/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rov-app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_APP_TOKEN: ${{ secrets.VITE_APP_TOKEN }}
          VITE_BASE: ${{ vars.VITE_BASE }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: rov-app/web/dist
